<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Every route sets its own <title>/<meta description> via the Seo component (react-helmet-async).
         react-helmet-async appends rather than replaces plain HTML tags, so a static title/description
         here would render as a duplicate alongside it and confuse search engines — keep this head lean. -->
    <meta name="theme-color" content="#10b981" />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dmpro-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
  </body>
</html>
